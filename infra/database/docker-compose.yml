services:
  postgres:
    image: postgres:17
    container_name: secureguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureguard
      POSTGRES_PASSWORD: secureguard
      POSTGRES_DB: secureguard
    ports:
      - "5432:5432"
    volumes:
      - secureguard_pgdata:/var/lib/postgresql/data
volumes:
  secureguard_pgdata:
